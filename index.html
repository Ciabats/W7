<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/style/style.css">
</head>

<body>

  <header class="site-header">
    <h1>La mia libreria</h1>
    <p>Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container">

    <section class="form-section">
      <!-- form per aggiungere un libro: titolo, autore, anno, formato (cartaceo/digitale) -->

      <div class="container">

        <div class="text-center mb-5">
          <h2>Aggiungi un libro</h2>
        </div>

        <div class="text-center mx-auto border border-2 pt-3 pb-3">

          <form action="#" id="aggiungi-libro" class="form">

            <div class="campo mb-3">
              <label for="titolo" class="form-label">Titolo</label>
              <input type="text" id="titolo" class="w-50">
            </div>

            <div class="campo mb-3">
              <label for="autore" class="form-label">Autore</label>
              <input type="text" id="autore" class="w-50">
            </div>

            <div class="campo mb-3">
              <label for="anno" class="form-label">Anno</label>
              <input type="number" id="anno" class="w-50">
            </div>

            <div class="campo mb-3">
              <label for="formato" class="form-label">Formato</label>
              <select name="formato" id="formato" class="w-50">
                <option value="CA">Cartaceo</option>
                <option value="CA">digitale</option>
              </select>
            </div>

            <div class="campo campo-condizionale mb-3" id="campo-dimensione" hidden>
              <label for="dimensione" class="form-label">Dimensione</label>
              <input type="number" id="dimensione" class="w-50">
            </div>
            <button type="submit" class="btn btn-primary w-50">Aggiungi</button>
          </form>
        </div>
      </div>
      
    </section>

    <section class="lista-section text-center">
      <h2>I tuoi libri</h2>
      <ul id="lista-libri">
        <!-- popolato da JavaScript -->
      </ul>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/script/script.js"></script>
</body>

</html>
